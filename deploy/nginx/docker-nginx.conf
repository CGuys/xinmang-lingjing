# Docker 内部专用的 Nginx 配置
upstream docker_backend {
    server server:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# 1. H5 端访问 (80 端口)
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html/h5;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain application/javascript text/css application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理 (包含大模型 SSE 支持)
    location /api/ {
        proxy_pass http://docker_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }

    # 静态资产反代
    location /assets/ {
        proxy_pass http://docker_backend/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
    }
}

# 2. 运营管理后台 (8080 端口)
server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html/admin;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain application/javascript text/css application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://docker_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location /assets/ {
        proxy_pass http://docker_backend/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
    }
}
