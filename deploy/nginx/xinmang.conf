# ========================================================
# 《心芒灵境》Nginx 生产环境配置参考
# ========================================================

# upstream 后端 Node.js API 服务
upstream xinmang_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# --------------------------------------------------------
# 1. 小程序 H5 端服务 (监听 80 端口，生产可替换为你的域名)
# --------------------------------------------------------
server {
    listen 80;
    server_name localhost;

    # H5 静态资源根目录 (打包生成的 miniprogram/dist/build/h5 绝对路径)
    root /www/xinmang-lingjing/miniprogram/dist/build/h5;
    index index.html;

    # Gzip 压缩优化
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_comp_level 6;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/json image/svg+xml;
    gzip_vary on;

    # 单页应用路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态静态资源长效缓存
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp3|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # API 接口反向代理
    location /api/ {
        proxy_pass http://xinmang_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 【关键】大模型心理测算 SSE 流式输出必须禁用缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }

    # 卡牌原画与静态多媒体资源代理 (如直接使用本地静态服务)
    location /assets/ {
        proxy_pass http://xinmang_backend/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}

# --------------------------------------------------------
# 2. 运营管理后台服务 (监听 8080 端口，生产可换为独立二级域名)
# --------------------------------------------------------
server {
    listen 8080;
    server_name localhost;

    # Admin 静态资源根目录 (打包生成的 admin/dist 绝对路径)
    root /www/xinmang-lingjing/admin/dist;
    index index.html;

    # Gzip 压缩优化
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain application/javascript text/css application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Admin 请求后端 API 代理
    location /api/ {
        proxy_pass http://xinmang_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # 卡牌原画资源代理
    location /assets/ {
        proxy_pass http://xinmang_backend/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
    }
}
