services:
  mysql:
    image: mysql:8.0
    container_name: xinmang-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Aa123456}
      MYSQL_DATABASE: xinmang_lingjing
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-Aa123456}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: xinmang-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.server
    container_name: xinmang-server
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD:-Aa123456}@mysql:3306/xinmang_lingjing
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./assets:/app/assets
      - ./logs:/app/logs
    ports:
      - "3000:3000"

  web:
    image: nginx:alpine
    container_name: xinmang-web
    restart: always
    depends_on:
      - server
    ports:
      - "80:80"     # H5 访问端口
      - "8080:8080" # 运营后台访问端口
    volumes:
      - ./deploy/nginx/docker-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./miniprogram/dist/build/h5:/usr/share/nginx/html/h5:ro
      - ./admin/dist:/usr/share/nginx/html/admin:ro

volumes:
  mysql_data:
  redis_data:
